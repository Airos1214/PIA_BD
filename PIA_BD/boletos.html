<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Boletos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Boletos</h1>
    <nav><a href="index.html">Inicio</a></nav>
</header>

<div class="container">

    <h2>Emitir Boleto</h2>

    <form id="formBoleto">
        <input id="numeroBoleto" placeholder="Número de boleto">
        <input id="precio" type="number" step="0.01" placeholder="Precio">
        <input id="asiento" placeholder="Asiento">
        <input id="idReserva" type="number" placeholder="ID Reserva">
        <input id="idPasajero" type="number" placeholder="ID Pasajero">
        <input id="idInstancia" type="number" placeholder="ID Instancia Vuelo">

        <button onclick="crearBoleto(event)">Emitir</button>
    </form>

    <h2>Lista de Boletos</h2>
    <table id="tablaBoletos"></table>

</div>

<script src="app.js"></script>
</body>
</html>
