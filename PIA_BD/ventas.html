<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ventas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Ventas</h1>
    <nav><a href="index.html">Inicio</a></nav>
</header>

<div class="container">

    <h2>Registrar Venta</h2>

    <form id="formVenta">
        <input id="total" type="number" step="0.01" placeholder="Total">
        <input id="impuestos" type="number" step="0.01" placeholder="Impuestos">
        <input id="idBoleto" type="number" placeholder="ID Boleto">

        <button onclick="crearVenta(event)">Guardar</button>
    </form>

</div>

<script src="app.js"></script>
</body>
</html>
